# Optional: local PostgreSQL for development (`docker compose up -d`).
# Matching URL: postgres://sentinel:sentinel@localhost:5432/sentinel
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pg:/var/lib/postgresql/data
volumes:
  sentinel_pg:
